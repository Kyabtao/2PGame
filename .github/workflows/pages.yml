# GitHub Pages deployment workflow (template).
#
# To use it, copy this file to  .github/workflows/pages.yml  in the repository
# (GitHub UI: "Add file" → paste, or `git mv tools/deploy/github-pages.workflow.yml .github/workflows/pages.yml`),
# then: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# It verifies all games and publishes on every push to main.
# The site is served at https://<owner>.github.io/2PGame/ — every link in the
# project is relative, so no base-path configuration is needed.
#
# (It lives here instead of .github/workflows/ because the automation that
# authored this repo isn't permitted to create workflow files directly.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    name: Verify games
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      # Manifest ↔ folders ↔ syntax check (fails the deploy if any game.js has a syntax error).
      - run: node tools/build.js

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the static site (node_modules is never committed).
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
